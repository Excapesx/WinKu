name: Android checks

on:
  push:
    branches: [main, 'codex/prompt-polish', 'codex/android-ppt-master']
    paths: ['apps/android/**', '.github/workflows/android-check.yml']
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android-check.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Test and compile Android UI
        working-directory: apps/android
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug -Pdsh.fetchShizuku=false --console=plain
      - name: Verify PPT Master export
        working-directory: apps/android
        run: |
          python -m pip install python-pptx==1.0.2
          PYTHONPATH=app/src/main/python python tools/test-ppt-master.py app/build/generated/ppt-master-assets/ppt-master-renderer.zip
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: apps/android/app/build/reports/tests/
          if-no-files-found: ignore
